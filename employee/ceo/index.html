<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex bg-charcoal-deep">

    <!-- Sidebar -->
    <aside class="w-64 bg-obsidian p-lg flex flex-col gap-2xl">
        <h1 class="text-2xl font-bold text-primary">One Voxel</h1>
        <nav class="flex flex-col gap-lg">
            <a href="index.html" class="flex items-center gap-md text-lg text-primary"><i class="ph ph-house"></i> Home</a>
            <a href="projects.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-kanban"></i> Projects</a>
            <a href="financials.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-chart-line"></i> Financials</a>
            <a href="../manager/team.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-users"></i> Team</a>
            <a href="../profile.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-user"></i> Profile</a>
        </nav>
        <div class="mt-auto">
            <a href="../login.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-sign-out"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-xl">
        <div class="container">
            <h1 class="text-4xl font-bold text-primary mb-xl">CEO Dashboard</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-xl mb-xl">
                <div class="card">
                    <div class="card-content">
                        <p class="text-secondary">Monthly Recurring Revenue</p>
                        <p class="text-4xl font-bold text-primary mt-sm">$50,000</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-content">
                        <p class="text-secondary">Active Projects</p>
                        <p class="text-4xl font-bold text-primary mt-sm">12</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-content">
                        <p class="text-secondary">Client Satisfaction</p>
                        <p class="text-4xl font-bold text-primary mt-sm">98%</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-xl">
                <!-- Project Profitability -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">Project Profitability</h2>
                        <!-- Placeholder for a chart -->
                        <div class="h-64 bg-surface-tertiary rounded-lg flex items-center justify-center text-muted">[Chart Placeholder]</div>
                    </div>
                </div>

                <!-- Revenue vs Expenses -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">Revenue vs Expenses</h2>
                        <!-- Placeholder for a chart -->
                        <div class="h-64 bg-surface-tertiary rounded-lg flex items-center justify-center text-muted">[Chart Placeholder]</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
