<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login - One Voxel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md">
        <div class="card p-2xl">
            <div class="card-content text-center">
                <h1 class="text-3xl font-bold text-primary mb-lg">Employee Login</h1>
                <form class="flex flex-col gap-md" action="index.html">
                    <input type="email" placeholder="Email Address" class="input" required>
                    <input type="password" placeholder="Password" class="input" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
