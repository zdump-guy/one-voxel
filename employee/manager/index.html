<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - One Voxel</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex bg-charcoal-deep">

    <!-- Sidebar -->
    <aside class="w-64 bg-obsidian p-lg flex flex-col gap-2xl">
        <h1 class="text-2xl font-bold text-primary">One Voxel</h1>
        <nav class="flex flex-col gap-lg">
            <a href="index.html" class="flex items-center gap-md text-lg text-primary"><i class="ph ph-house"></i> Home</a>
            <a href="tasks.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-check-square"></i> Tasks</a>
            <a href="team.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-users"></i> Team</a>
            <a href="../pay.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-credit-card"></i> Pay</a>
            <a href="../chat.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-chat-dots"></i> Chat</a>
            <a href="../profile.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-user"></i> Profile</a>
        </nav>
        <div class="mt-auto">
            <a href="../login.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-sign-out"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-xl">
        <div class="container">
            <h1 class="text-4xl font-bold text-primary mb-xl">Manager Dashboard</h1>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-xl">
                <!-- Team Task Overview -->
                <div class="card lg:col-span-2">
                    <div class="card-content">
                        <h2 class="card-title">Team Task Overview</h2>
                        <div class="grid grid-cols-3 gap-md text-center">
                            <div>
                                <p class="text-3xl font-bold text-primary">15</p>
                                <p class="text-secondary">In Progress</p>
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-primary">5</p>
                                <p class="text-secondary">In Review</p>
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-primary">3</p>
                                <p class="text-secondary text-red-400">Overdue</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Time Off Requests -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">Time Off Requests</h2>
                        <div class="flex justify-between items-center">
                            <p class="text-secondary">Pending Requests</p>
                            <p class="text-3xl font-bold text-primary">2</p>
                        </div>
                        <button class="btn btn-secondary w-full mt-md">Review Requests</button>
                    </div>
                </div>

                <!-- My Task Summary -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">My Task Summary</h2>
                        <div class="flex justify-between items-center mb-md">
                            <p class="text-secondary">Active Tasks</p>
                            <p class="text-2xl font-bold text-primary">3</p>
                        </div>
                        <div class="flex justify-between items-center">
                            <p class="text-secondary">Completion Rate</p>
                            <p class="text-2xl font-bold text-primary">98%</p>
                        </div>
                    </div>
                </div>

                <!-- Earnings Summary -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">My Earnings</h2>
                        <div class="flex justify-between items-center">
                            <p class="text-secondary">Current Month</p>
                            <p class="text-2xl font-bold text-primary">$7,500</p>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="card">
                    <div class="card-content">
                        <h2 class="card-title">Recent Messages</h2>
                        <p class="text-secondary">No new messages.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
