<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Tasks - One Voxel</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex bg-charcoal-deep">

    <!-- Sidebar -->
    <aside class="w-64 bg-obsidian p-lg flex flex-col gap-2xl">
        <h1 class="text-2xl font-bold text-primary">One Voxel</h1>
        <nav class="flex flex-col gap-lg">
            <a href="index.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-house"></i> Home</a>
            <a href="tasks.html" class="flex items-center gap-md text-lg text-primary"><i class="ph ph-check-square"></i> Tasks</a>
            <a href="team.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-users"></i> Team</a>
            <a href="../pay.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-credit-card"></i> Pay</a>
            <a href="../chat.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-chat-dots"></i> Chat</a>
            <a href="../profile.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-user"></i> Profile</a>
        </nav>
        <div class="mt-auto">
            <a href="../login.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-sign-out"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-xl">
        <div class="container">
            <div class="flex justify-between items-center mb-xl">
                <h1 class="text-4xl font-bold text-primary">Team Tasks</h1>
                <button class="btn btn-primary">Create New Task</button>
            </div>

            <!-- Team Task Table -->
            <div class="card">
                <div class="card-content">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-border-primary">
                                <th class="py-md text-primary">Task</th>
                                <th class="py-md text-primary">Assignee</th>
                                <th class="py-md text-primary">Priority</th>
                                <th class="py-md text-primary">Status</th>
                                <th class="py-md text-primary">Deadline</th>
                                <th class="py-md text-primary">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="py-md text-secondary">Implement Hero Section</td>
                                <td class="py-md text-secondary">John Doe</td>
                                <td class="py-md text-red-400">High</td>
                                <td class="py-md text-secondary">In Progress</td>
                                <td class="py-md text-secondary">2025-09-20</td>
                                <td class="py-md"><a href="#" class="text-accent hover:text-primary">Details</a></td>
                            </tr>
                            <tr>
                                <td class="py-md text-secondary">Fix Login Bug</td>
                                <td class="py-md text-secondary">Jane Smith</td>
                                <td class="py-md text-yellow-400">Medium</td>
                                <td class="py-md text-secondary">In Progress</td>
                                <td class="py-md text-secondary">2025-09-22</td>
                                <td class="py-md"><a href="#" class="text-accent hover:text-primary">Details</a></td>
                            </tr>
                            <tr>
                                <td class="py-md text-secondary">Design new logo</td>
                                <td class="py-md text-secondary">John Doe</td>
                                <td class="py-md text-green-400">Low</td>
                                <td class="py-md text-green-400">Completed</td>
                                <td class="py-md text-secondary">2025-09-15</td>
                                <td class="py-md"><a href="#" class="text-accent hover:text-primary">Details</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
