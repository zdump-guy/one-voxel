<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - One Voxel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex bg-charcoal-deep">

    <!-- Sidebar -->
    <aside class="w-64 bg-obsidian p-lg flex flex-col gap-2xl">
        <h1 class="text-2xl font-bold text-primary">One Voxel</h1>
        <nav class="flex flex-col gap-lg">
            <a href="index.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-house"></i> Home</a>
            <a href="tasks.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-check-square"></i> Tasks</a>
            <a href="pay.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-credit-card"></i> Pay</a>
            <a href="chat.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-chat-dots"></i> Chat</a>
            <a href="profile.html" class="flex items-center gap-md text-lg text-primary"><i class="ph ph-user"></i> Profile</a>
        </nav>
        <div class="mt-auto">
            <a href="login.html" class="flex items-center gap-md text-lg text-accent hover:text-primary"><i class="ph ph-sign-out"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-xl">
        <div class="container">
            <h1 class="text-4xl font-bold text-primary mb-xl">My Profile</h1>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-xl">
                <!-- Personal Information -->
                <div class="lg:col-span-2">
                    <div class="card">
                        <div class="card-content">
                            <h2 class="card-title">Personal Information</h2>
                            <form class="grid grid-cols-1 md:grid-cols-2 gap-md">
                                <input type="text" value="John Doe" class="input">
                                <input type="email" value="john.doe@onevoxel.dev" class="input">
                                <input type="tel" value="(123) 456-7890" class="input">
                                <input type="text" value="Engineering" class="input" disabled>
                                <div class="md:col-span-2">
                                    <textarea placeholder="Skills and Certifications" class="input">HTML, CSS, JavaScript, React, Node.js</textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Profile Picture & Employment Details -->
                <div class="card">
                    <div class="card-content text-center">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile Picture" class="w-32 h-32 rounded-full mx-auto mb-md border-2 border-accent">
                        <button class="btn btn-secondary mb-lg">Change Picture</button>
                        <div>
                            <p class="text-secondary">Hire Date: 2022-01-15</p>
                            <p class="text-secondary">Employee ID: OV-1024</p>
                            <p class="text-secondary">Position: Frontend Developer</p>
                            <p class="text-secondary">Manager: Maria Garcia</p>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="lg:col-span-3 card">
                    <div class="card-content">
                        <h2 class="card-title">Settings</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-xl">
                            <div>
                                <h3 class="text-xl font-semibold text-primary mb-md">Change Password</h3>
                                <form class="flex flex-col gap-md">
                                    <input type="password" placeholder="Current Password" class="input">
                                    <input type="password" placeholder="New Password" class="input">
                                    <input type="password" placeholder="Confirm New Password" class="input">
                                    <button class="btn btn-primary">Update Password</button>
                                </form>
                            </div>
                            <div>
                                <h3 class="text-xl font-semibold text-primary mb-md">Notification Preferences</h3>
                                <div class="flex flex-col gap-md">
                                    <label class="flex items-center gap-md"><input type="checkbox" checked> Email Notifications</label>
                                    <label class="flex items-center gap-md"><input type="checkbox" checked> Desktop Notifications</label>
                                    <label class="flex items-center gap-md"><input type="checkbox"> SMS Notifications</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
